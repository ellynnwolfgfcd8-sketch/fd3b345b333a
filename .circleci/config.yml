          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load vinyl rip
          command: |
            : > rip.wav
      - run:
          name: Build declicker
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target click-remover -j2
      - run:
          name: Remove clicks
